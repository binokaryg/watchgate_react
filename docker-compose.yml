services:
  watchgate-frontend:
    container_name: watchgate-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL}
        API_KEY: ${API_KEY}
    expose:
      - 80
    networks:
      - openmrs_network
    restart: unless-stopped

networks:
  openmrs_network:
    external: true